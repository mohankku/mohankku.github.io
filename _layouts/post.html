---
layout: default
---

<div class="post-header">
  <time class="post-header-date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
  <h1 class="post-header-title">{{ page.title }}</h1>
  <p class="post-header-byline">by {{ page.author | default: site.author }}</p>
</div>

{{content}}

{% if page.tags %}
  <small>tags: <em>{{ page.tags | join: "</em> - <em>" }}</em></small>
{% endif %}
