name: Stocks Live Fetch

on:
  schedule:
    # Twice per trading day instead of hourly: midday snapshot + post-close
    # snapshot. 16:30 UTC ~= 12:30 ET, 20:30 UTC ~= 16:30 ET, Mon-Fri.
    # (Schedules are best-effort; repository_dispatch below fills gaps.)
    - cron: '30 16,20 * * 1-5'
  # External cron (e.g. cron-job.org) POSTs {"event_type":"stocks-refresh"} here
  # for reliable runs — dispatch events are never skipped like schedules.
  repository_dispatch:
    types: [stocks-refresh]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stocks-live
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch sector stocks (TwelveData -> Yahoo -> Alpha)
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          # Skip NYSE holidays (schedule covers Mon-Fri only; holidays would burn fetches)
          ET_D=$(TZ='America/New_York' date +%F)
          case "$ET_D" in
            2026-09-07|2026-11-26|2026-12-25|2027-01-01|2027-01-18|2027-02-15|2027-04-02|2027-05-31|2027-06-18|2027-07-05|2027-09-06|2027-11-25|2027-12-24)
              echo "NYSE holiday ($ET_D), skipping fetch"; exit 0;;
          esac
          python3 script/fetch_stocks.py \
            --live assets/stocks-live.json \
            --history assets/stocks-history.json \
          || echo "All sources failed, keeping existing files"
          head -c 800 assets/stocks-live.json; echo ""
      - name: Commit if data meaningfully changed
        run: |
          # Timestamps (fetched_at/last_updated/updated) change on every run,
          # so compare payloads with those keys stripped — no commit when
          # prices didn't actually move (weekends, holidays, flat market).
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 - <<'PY'
          import json, subprocess
          VOLATILE = {"fetched_at", "last_updated", "updated"}
          FILES = ["assets/stocks-live.json", "assets/stocks-history.json"]
          def head_version(path):
              try:
                  out = subprocess.run(
                      ["git", "show", f"HEAD:{path}"],
                      capture_output=True, text=True, check=True,
                  )
                  return json.loads(out.stdout)
              except Exception:
                  return None
          def normalize(payload):
              if isinstance(payload, dict):
                  return {k: payload[k] for k in sorted(payload) if k not in VOLATILE}
              return payload
          changed = []
          for path in FILES:
              try:
                  with open(path) as f:
                      current = normalize(json.load(f))
              except FileNotFoundError:
                  continue
              if normalize(head_version(path)) != current:
                  changed.append(path)
          if changed:
              subprocess.run(["git", "add", *changed], check=True)
              subprocess.run(
                  ["git", "commit", "-m", "chore: update stocks live data [skip ci]"],
                  check=True,
              )
              print(f"Committed: {changed}")
          else:
              print("No meaningful change, skipping commit")
          PY
          git push || echo "nothing to push or push failed"
