name: Stocks Live Fetch

on:
  schedule:
    # Hourly during NYSE trading hours 9:30-16 ET = 13:30-20 UTC, Mon-Fri.
    # :23 chosen over :05 to dodge scheduler contention (schedules are best-effort).
    - cron: '23 13-20 * * 1-5'
  # External cron (e.g. cron-job.org) POSTs {"event_type":"stocks-refresh"} here
  # for reliable hourly runs — dispatch events are never skipped like schedules.
  repository_dispatch:
    types: [stocks-refresh]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Tech Live (TwelveData preferred, Yahoo fallback, Alpha last resort)
        env:
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          mkdir -p assets
          TECH_SYMS="AAPL,MSFT,GOOGL,META,AMZN,NFLX,ADBE,CSCO,IBM,NOW,NVDA,AMD,AVGO,TSM,MU,INTC,ARM,SMCI,DELL,ON,ASML,LRCX,KLAC,AMAT,ENTG,TER,SNPS,CDNS,COHR,MKSI,QCOM,TXN,NXPI,MRVL,ANET,CIEN,CRDO,LITE,FFIV,EXTR,ORCL,CRM,PLTR,CRWD,TSLA,SNOW,DDOG,PANW,ZS,TEAM,MRNA,REGN,VRTX,AMGN,GILD,BIIB,LLY,NVO,PFE,MRK"
          fetched=false

          # 1) TwelveData (per-symbol quote, requires TWELVEDATA_API_KEY)
          if [ -n "$TWELVEDATA_API_KEY" ]; then
            echo "Fetching Tech via TwelveData (60 symbols, 1/hour)..."
            rm -f /tmp/tech.json; echo "[]" > /tmp/tech.json
            IFS=',' read -ra SYMS <<< "$TECH_SYMS"
            for sym in "${SYMS[@]}"; do
              curl -s "https://api.twelvedata.com/quote?symbol=$sym&interval=1day&apikey=$TWELVEDATA_API_KEY" -o /tmp/q.json
              if grep -q '"symbol"' /tmp/q.json; then
                price=$(jq -r '.close' /tmp/q.json)
                chg=$(jq -r '.change' /tmp/q.json)
                pct=$(jq -r '.percent_change' /tmp/q.json)
                vol=$(jq -r '.volume' /tmp/q.json)
                jq --arg t "$sym" --arg p "$price" --arg c "$chg" --arg pc "$pct" --arg v "$vol" '. + [{ticker:$t, price:$p, change_amount:$c, change_percentage:($pc+"%"), volume:$v}]' /tmp/tech.json > /tmp/tech2.json && mv /tmp/tech2.json /tmp/tech.json
                echo "Fetched $sym $price $pc%"
              else
                echo "Failed $sym: $(cat /tmp/q.json | head -c 200)"
              fi
              sleep 2
            done
            if [ "$(jq 'length' /tmp/tech.json)" -ge 5 ]; then
              cat /tmp/tech.json | jq -c 'sort_by(.change_percentage|tonumber) | reverse' > /tmp/sorted.json
              jq -n --slurpfile tech /tmp/sorted.json --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg lu "$(TZ='America/New_York' date '+%Y-%m-%d %H:%M:%S US/Eastern')" '{metadata:"Sector stocks — 6 sectors x 10", last_updated:$lu, fetched_at:$ts, top_gainers: ($tech[0][:12] | sort_by(.change_percentage|tonumber) | reverse | .[:12]), top_losers: ($tech[0] | sort_by(.change_percentage|tonumber) | .[:12]), tech_all: $tech[0] }' > assets/stocks-live.json
              jq '.top_gainers |= map(select(.change_percentage|tonumber > 0)) | .top_losers |= map(select(.change_percentage|tonumber < 0))' assets/stocks-live.json > /tmp/f.json && mv /tmp/f.json assets/stocks-live.json
              echo "TwelveData Tech fetched $(jq '.top_gainers|length' assets/stocks-live.json) gainers, $(jq '.top_losers|length' assets/stocks-live.json) losers"
              fetched=true
            else
              echo "TwelveData yielded too few symbols, falling through"
            fi
          fi

          # 2) Yahoo Finance fallback (no key, free) — fetch each tech symbol
          if [ "$fetched" = false ]; then
            echo "Trying Yahoo Finance for 60 symbols (no key needed)..."
            python3 << 'PY'
          import json, urllib.request, time
          syms = "AAPL,MSFT,GOOGL,META,AMZN,NFLX,ADBE,CSCO,IBM,NOW,NVDA,AMD,AVGO,TSM,MU,INTC,ARM,SMCI,DELL,ON,ASML,LRCX,KLAC,AMAT,ENTG,TER,SNPS,CDNS,COHR,MKSI,QCOM,TXN,NXPI,MRVL,ANET,CIEN,CRDO,LITE,FFIV,EXTR,ORCL,CRM,PLTR,CRWD,TSLA,SNOW,DDOG,PANW,ZS,TEAM,MRNA,REGN,VRTX,AMGN,GILD,BIIB,LLY,NVO,PFE,MRK".split(",")
          results=[]
          for sym in syms:
              url = f'https://query1.finance.yahoo.com/v8/finance/chart/{sym}?interval=1d&range=1d'
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=10) as r:
                      data=json.load(r)
                      meta=data['chart']['result'][0]['meta']
                      price=meta['regularMarketPrice']
                      prev=meta['chartPreviousClose']
                      chg=price-prev
                      pct=(chg/prev*100) if prev else 0
                      vol=str(meta.get('regularMarketVolume',0))
                      results.append({"ticker":sym,"price":f"{price:.2f}","change_amount":f"{chg:.2f}","change_percentage":f"{pct:.4f}%","volume":vol})
                      print(f"Yahoo {sym} {price} {pct:.2f}%")
              except Exception as e:
                  print(f"Yahoo failed {sym}: {e}")
              time.sleep(0.3)
          if len(results) >= 5:
              pos = sorted([r for r in results if float(r['change_percentage'].replace('%',''))>0], key=lambda x: float(x['change_percentage'].replace('%','')), reverse=True)
              neg = sorted([r for r in results if float(r['change_percentage'].replace('%',''))<0], key=lambda x: float(x['change_percentage'].replace('%','')))
              all_sorted = sorted(results, key=lambda x: float(x['change_percentage'].replace('%','')), reverse=True)
              import datetime, zoneinfo
              now_utc = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
              tz = zoneinfo.ZoneInfo("America/New_York")
              now_et = datetime.datetime.now(tz).strftime("%Y-%m-%d %H:%M:%S US/Eastern")
              out={"metadata":"Sector stocks — 6 sectors x 10","last_updated":now_et,"fetched_at":now_utc,"top_gainers":pos[:12],"top_losers":neg[:12],"tech_all":all_sorted}
              open("assets/stocks-live.json","w").write(json.dumps(out, indent=2))
              print(f"Yahoo wrote {len(pos)} gainers {len(neg)} losers all {len(all_sorted)}")
          else:
              print(f"Yahoo insufficient {len(results)} results")
              import sys; sys.exit(1)
          PY
            if [ $? -eq 0 ] && [ -f assets/stocks-live.json ] && [ "$(jq '.top_gainers|length + .top_losers|length' assets/stocks-live.json)" -ge 5 ]; then
              echo "Yahoo succeeded: $(jq '.top_gainers|length' assets/stocks-live.json) gainers, $(jq '.top_losers|length' assets/stocks-live.json) losers"
              fetched=true
            else
              echo "Yahoo fallback failed, trying Alpha"
            fi
          fi

          # 3) Alpha Vantage TOP_GAINERS_LOSERS last resort — only if tech-filtered
          if [ "$fetched" = false ]; then
            if [ -z "$ALPHAVANTAGE_API_KEY" ]; then
              echo "No API keys and Yahoo failed, keeping existing assets/stocks-live.json"
              exit 0
            fi
            echo "Fetching Alpha TOP_GAINERS_LOSERS as last resort..."
            curl -s "https://www.alphavantage.co/query?function=TOP_GAINERS_LOSERS&apikey=$ALPHAVANTAGE_API_KEY" -o /tmp/alpha.json
            if grep -q '"Information"' /tmp/alpha.json; then
              echo "Alpha rate-limited or error: $(cat /tmp/alpha.json | head -c 300)"
              echo "Keeping existing file"
              exit 0
            fi
            TECH_LIST="AAPL,MSFT,GOOGL,META,AMZN,NFLX,ADBE,CSCO,IBM,NOW,NVDA,AMD,AVGO,TSM,MU,INTC,ARM,SMCI,DELL,ON,ASML,LRCX,KLAC,AMAT,ENTG,TER,SNPS,CDNS,COHR,MKSI,QCOM,TXN,NXPI,MRVL,ANET,CIEN,CRDO,LITE,FFIV,EXTR,ORCL,CRM,PLTR,CRWD,TSLA,SNOW,DDOG,PANW,ZS,TEAM,MRNA,REGN,VRTX,AMGN,GILD,BIIB,LLY,NVO,PFE,MRK"
            jq --arg tech "$TECH_LIST" --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
              .fetched_at = $ts |
              .metadata = "Sector stocks — 6 sectors x 10 (Alpha filtered)" |
              (.top_gainers | map(select(.ticker as $t | ($tech | split(",")) | index($t)))) as $g |
              (.top_losers | map(select(.ticker as $t | ($tech | split(",")) | index($t)))) as $l |
              .top_gainers = $g |
              .top_losers = $l
            ' /tmp/alpha.json > /tmp/alpha_filtered.json
            gcount=$(jq '.top_gainers|length' /tmp/alpha_filtered.json)
            lcount=$(jq '.top_losers|length' /tmp/alpha_filtered.json)
            if [ "$gcount" -ge 3 ] && [ "$lcount" -ge 3 ]; then
              mv /tmp/alpha_filtered.json assets/stocks-live.json
              echo "Alpha filtered kept: $gcount gainers $lcount losers"
              fetched=true
            else
              echo "Alpha filtered has insufficient tech ($gcount/$lcount), keeping existing file"
              exit 0
            fi
          fi

          cat assets/stocks-live.json | head -c 800
          echo ""
      - name: Commit if changed
        run: |
          if [ -f assets/stocks-live.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/stocks-live.json
            git diff --staged --quiet || git commit -m "chore: update stocks live data [skip ci]"
            git push || echo "nothing to push or push failed"
          fi
